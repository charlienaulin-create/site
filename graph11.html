<!DOCTYPE html>
<html>
<head>
  <title>Crypto Pro Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{
      background:#121212;
      color:white;
      font-family:Arial;
      padding:20px;
      text-align:center;
    }

    h1{margin-bottom:20px;}

    #crypto-container{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:20px;
    }

    .card{
      background:#1e1e1e;
      padding:15px;
      border-radius:15px;
      width:230px;
      cursor:pointer;
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.05);
    }

    canvas{
      margin-top:15px;
      display:none;
    }

    .positive{color:#00ff99;}
    .negative{color:#ff4d4d;}
  </style>
</head>
<body>

<h1>🚀 Crypto Pro Dashboard (Top 10)</h1>
<p>👉 Clique sur une crypto pour afficher son graphique</p>

<div id="crypto-container"></div>

<script>
let charts = {};
let loadedCharts = {};

async function loadData(){
  const response = await fetch(
    `https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&order=market_cap_desc&per_page=10&page=1`
  );

  const data = await response.json();
  displayCards(data);
}

function displayCards(data){
  const container = document.getElementById("crypto-container");
  container.innerHTML="";

  data.forEach(coin=>{
    const card=document.createElement("div");
    card.className="card";
    card.onclick=()=>toggleChart(coin.id);

    card.innerHTML=`
      <h3>${coin.name}</h3>
      <p>${coin.current_price} €</p>
      <p class="${coin.price_change_percentage_24h>=0?'positive':'negative'}">
      ${coin.price_change_percentage_24h.toFixed(2)}%</p>
      <canvas id="chart-${coin.id}"></canvas>
    `;

    container.appendChild(card);
  });
}

async function toggleChart(id){
  const canvas=document.getElementById(`chart-${id}`);

  if(canvas.style.display==="block"){
    canvas.style.display="none";
    return;
  }

  canvas.style.display="block";

  if(loadedCharts[id]) return;

  const res=await fetch(
    `https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=eur&days=7`
  );

  const data=await res.json();

  const ctx=canvas.getContext("2d");

  charts[id]=new Chart(ctx,{
    type:"line",
    data:{
      labels:data.prices.map(p=>new Date(p[0]).toLocaleDateString()),
      datasets:[{
        data:data.prices.map(p=>p[1]),
        borderColor:"#00ff99",
        tension:0.3,
        fill:false
      }]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:false}}
    }
  });

  loadedCharts[id]=true;
}

loadData();
</script>

</body>
</html>
