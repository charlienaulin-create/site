<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Crypto Stable</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 40px;
    }

    #crypto-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 15px;
      width: 180px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transition: transform 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .price {
      font-size: 1.3em;
      margin: 10px 0;
    }

    .positive {
      color: #00ff99;
    }

    .negative {
      color: #ff4d4d;
    }

    button {
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      background: #00ff99;
      font-weight: bold;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.2s;
    }

    button:hover {
      background: #00cc7a;
    }

    #chart-container {
      width: 95%;
      max-width: 900px;
      margin: 40px auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<h1>Dashboard Crypto Stable</h1>

<div id="crypto-container"></div>

<button onclick="getPrices()">Actualiser toutes les crypto</button>

<div id="chart-container">
  <canvas id="cryptoChart"></canvas>
</div>

<script>
  const cryptos = ["bitcoin","ethereum","binancecoin","cardano","solana"];
  const cryptoNames = {
    bitcoin: "Bitcoin",
    ethereum: "Ethereum",
    binancecoin: "Binance Coin",
    cardano: "Cardano",
    solana: "Solana"
  };

  const container = document.getElementById("crypto-container");
  let chart;

  // Créer les cartes pour chaque crypto
  cryptos.forEach(id => {
    const div = document.createElement("div");
    div.className = "card";
    div.id = id;
    div.innerHTML = `
      <h2>${cryptoNames[id]}</h2>
      <h3 class="price">Chargement...</h3>
      <p class="change"></p>
    `;
    div.addEventListener("click", () => showChart(id));
    container.appendChild(div);
  });

  // Fonction pour récupérer les prix et variations
  async function getPrices() {
    try {
      const response = await fetch(
        `https://api.coingecko.com/api/v3/simple/price?ids=${cryptos.join(",")}&vs_currencies=eur&include_24hr_change=true`
      );
      if(!response.ok) throw new Error("Erreur API");

      const data = await response.json();

      cryptos.forEach(id => {
        const price = data[id].eur;
        const change = data[id].eur_24h_change;

        const card = document.getElementById(id);
        card.querySelector(".price").innerText = price + " €";

        const changeEl = card.querySelector(".change");
        changeEl.innerText = change.toFixed(2) + " % (24h)";
        changeEl.className = change >= 0 ? "change positive" : "change negative";
      });
    } catch(error) {
      alert("Impossible de récupérer les prix ! Ouvre avec Live Server ou HTTPS.");
      console.error(error);
    }
  }

  // Fonction pour afficher le graphique détaillé d'une crypto
  async function showChart(id) {
    try {
      const response = await fetch(
        `https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=eur&days=7&interval=daily`
      );
      if(!response.ok) throw new Error("Erreur API graphique");

      const data = await response.json();

      // Vérifier que les données existent
      if(!data.prices || data.prices.length === 0){
        alert(`Pas de données disponibles pour ${cryptoNames[id]}`);
        return;
      }

      // Préparer labels et valeurs
      const labels = data.prices.map(p => {
        const date = new Date(p[0]);
        return `${date.getDate()}/${date.getMonth()+1}`;
      });
      const prices = data.prices.map(p => p[1]);

      const ctx = document.getElementById('cryptoChart').getContext('2d');

      // Supprimer graphique précédent
      if(chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: cryptoNames[id] + " Prix (€)",
            data: prices,
            borderColor: '#00ff99',
            backgroundColor: 'rgba(0,255,153,0.3)',
            tension: 0.3,
            fill: true,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          plugins: {
            tooltip: {
              mode: 'index',
              intersect: false,
              callbacks: {
                label: function(context) {
                  return "Prix : " + context.formattedValue + " €";
                }
              }
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              grid: { color: 'rgba(255,255,255,0.1)' }
            },
            x: {
              grid: { color: 'rgba(255,255,255,0.1)' }
            }
          }
        }
      });

    } catch(error) {
      alert("Impossible de récupérer le graphique !");
      console.error(error);
    }
  }

  // Charger les prix dès le départ
  getPrices();
</script>

</body>
</html>
