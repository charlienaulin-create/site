<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Crypto avec Graphiques</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 40px;
    }

    #crypto-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 15px;
      width: 180px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      transition: transform 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .price {
      font-size: 1.3em;
      margin: 10px 0;
    }

    .positive {
      color: #00ff99;
    }

    .negative {
      color: #ff4d4d;
    }

    button {
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      background: #00ff99;
      font-weight: bold;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.2s;
    }

    button:hover {
      background: #00cc7a;
    }

    /* Conteneur du graphique */
    #chart-container {
      width: 90%;
      max-width: 800px;
      margin: 40px auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<h1>Dashboard Crypto avec Graphiques</h1>

<div id="crypto-container"></div>

<button onclick="getPrices()">Actualiser toutes les crypto</button>

<!-- Conteneur du graphique -->
<div id="chart-container">
  <canvas id="cryptoChart"></canvas>
</div>

<script>
  const cryptos = ["bitcoin","ethereum","binancecoin","cardano","solana"];
  const cryptoNames = {
    bitcoin: "Bitcoin",
    ethereum: "Ethereum",
    binancecoin: "Binance Coin",
    cardano: "Cardano",
    solana: "Solana"
  };

  const container = document.getElementById("crypto-container");
  let chart; // Pour stocker le graphique

  // Créer les cartes
  cryptos.forEach(id => {
    const div = document.createElement("div");
    div.className = "card";
    div.id = id;
    div.innerHTML = `
      <h2>${cryptoNames[id]}</h2>
      <h3 class="price">Chargement...</h3>
      <p class="change"></p>
    `;
    div.addEventListener("click", () => showChart(id));
    container.appendChild(div);
  });

  // Fonction pour récupérer les prix
  async function getPrices() {
    try {
      const response = await fetch(
        "https://api.coingecko.com/api/v3/simple/price?ids=" +
        cryptos.join(",") +
        "&vs_currencies=eur&include_24hr_change=true"
      );
      if (!response.ok) throw new Error("Erreur API");
      const data = await response.json();

      cryptos.forEach(id => {
        const price = data[id].eur;
        const change = data[id].eur_24h_change;

        const card = document.getElementById(id);
        card.querySelector(".price").innerText = price + " €";

        const changeElement = card.querySelector(".change");
        changeElement.innerText = change.toFixed(2) + " % (24h)";
        changeElement.className = change >= 0 ? "change positive" : "change negative";
      });
    } catch (error) {
      alert("Impossible de récupérer les prix ! Ouvre avec Live Server.");
      console.error(error);
    }
  }

  // Fonction pour afficher le graphique d’une crypto
  async function showChart(id) {
    try {
      const response = await fetch(
        `https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=eur&days=7&interval=hourly`
      );
      if (!response.ok) throw new Error("Erreur API graphique");
      const data = await response.json();

      const labels = data.prices.map(p => {
        const date = new Date(p[0]);
        return `${date.getDate()}/${date.getMonth()+1}`;
      });
      const prices = data.prices.map(p => p[1]);

      const ctx = document.getElementById('cryptoChart').getContext('2d');

      if(chart) chart.destroy(); // supprimer le graphique précédent

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: cryptoNames[id] + " Prix (€)",
            data: prices,
            borderColor: '#00ff99',
            backgroundColor: 'rgba(0,255,153,0.2)',
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: false
            }
          }
        }
      });

    } catch(error) {
      alert("Impossible de récupérer le graphique !");
      console.error(error);
    }
  }

  getPrices();
</script>

</body>
</html>
