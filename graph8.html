<!DOCTYPE html>
<html>
<head>
  <title>Crypto Pro Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background:#121212;
      color:white;
      font-family:Arial;
      padding:20px;
      text-align:center;
      transition:0.3s;
    }

    .light {
      background:white;
      color:black;
    }

    h1 { margin-bottom:20px; }

    #controls {
      margin-bottom:20px;
    }

    input, select, button {
      padding:8px;
      margin:5px;
      border-radius:8px;
      border:none;
    }

    button {
      background:#00ff99;
      font-weight:bold;
      cursor:pointer;
    }

    #crypto-container {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:20px;
    }

    .card {
      background:#1e1e1e;
      padding:15px;
      border-radius:15px;
      width:230px;
      box-shadow:0 4px 8px rgba(0,0,0,0.5);
      transition:0.3s;
    }

    .light .card {
      background:#f3f3f3;
    }

    canvas {
      margin-top:15px;
    }

    .positive { color:#00ff99; }
    .negative { color:#ff4d4d; }

    @media(max-width:600px){
      .card { width:95%; }
    }
  </style>
</head>
<body>

<h1>🚀 Crypto Pro Dashboard</h1>

<div id="controls">
  🔎 <input type="text" id="search" placeholder="Rechercher crypto...">
  
  📅
  <select id="period">
    <option value="7">7 jours</option>
    <option value="30">30 jours</option>
    <option value="90">90 jours</option>
  </select>

  💱
  <select id="currency">
    <option value="eur">EUR</option>
    <option value="usd">USD</option>
  </select>

  <button onclick="toggleTheme()">🌙 / ☀️</button>
  <button onclick="loadData()">Actualiser</button>
</div>

<h3 id="top-move"></h3>

<div>
  💰 Convertisseur :
  <input type="number" id="amount" placeholder="Montant">
  <select id="convert-crypto"></select>
  <button onclick="convert()">Convertir</button>
  <span id="convert-result"></span>
</div>

<hr>

<div id="crypto-container"></div>

<script>
let charts = {};
let cryptos = [];

async function loadData(){
  const currency = document.getElementById("currency").value;
  const period = document.getElementById("period").value;

  const response = await fetch(
    `https://api.coingecko.com/api/v3/coins/markets?vs_currency=${currency}&order=market_cap_desc&per_page=20&page=1`
  );

  const data = await response.json();
  cryptos = data;

  displayTopMover();
  displayCards(data);
  populateConvertSelect();
}

function displayTopMover(){
  let sorted = [...cryptos].sort((a,b)=>b.price_change_percentage_24h - a.price_change_percentage_24h);
  const top = sorted[0];
  document.getElementById("top-move").innerHTML =
    `🥇 Plus grosse hausse : ${top.name} (${top.price_change_percentage_24h.toFixed(2)}%)`;
}

function displayCards(data){
  const container = document.getElementById("crypto-container");
  container.innerHTML="";
  const currency = document.getElementById("currency").value;
  const period = document.getElementById("period").value;

  data.forEach(coin=>{
    const card = document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <h3>${coin.name}</h3>
      <p>${coin.current_price} ${currency.toUpperCase()}</p>
      <p class="${coin.price_change_percentage_24h>=0?'positive':'negative'}">
      ${coin.price_change_percentage_24h.toFixed(2)}%</p>
      <canvas id="chart-${coin.id}"></canvas>
    `;
    container.appendChild(card);
    loadChart(coin.id, period, currency);
  });
}

async function loadChart(id, days, currency){
  try{
    const res = await fetch(
      `https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=${currency}&days=${days}`
    );
    const data = await res.json();
    if(!data.prices || data.prices.length<2) return;

    const ctx = document.getElementById(`chart-${id}`).getContext("2d");
    if(charts[id]) charts[id].destroy();

    charts[id]= new Chart(ctx,{
      type:"line",
      data:{
        labels:data.prices.map(p=>new Date(p[0]).toLocaleDateString()),
        datasets:[{
          data:data.prices.map(p=>p[1]),
          borderColor:"#00ff99",
          tension:0.3,
          fill:false
        }]
      },
      options:{ responsive:true, plugins:{legend:{display:false}} }
    });

  }catch(e){
    console.log("Erreur graphique",id);
  }
}

function populateConvertSelect(){
  const select=document.getElementById("convert-crypto");
  select.innerHTML="";
  cryptos.forEach(c=>{
    const option=document.createElement("option");
    option.value=c.id;
    option.textContent=c.name;
    select.appendChild(option);
  });
}

function convert(){
  const amount=document.getElementById("amount").value;
  const id=document.getElementById("convert-crypto").value;
  const coin=cryptos.find(c=>c.id===id);
  const result=(amount/coin.current_price).toFixed(6);
  document.getElementById("convert-result").innerText=
    ` = ${result} ${coin.symbol.toUpperCase()}`;
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

document.getElementById("search").addEventListener("input",function(){
  const value=this.value.toLowerCase();
  const filtered=cryptos.filter(c=>c.name.toLowerCase().includes(value));
  displayCards(filtered);
});

document.getElementById("period").addEventListener("change",loadData);
document.getElementById("currency").addEventListener("change",loadData);

loadData();
</script>

</body>
</html>
